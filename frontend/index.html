<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0806">
    <title>MRD Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="window" role="main">

    <!-- Title bar -->
    <header class="titlebar">
        <div class="traffic-lights" aria-hidden="true">
            <span class="tl red"></span>
            <span class="tl yellow"></span>
            <span class="tl green"></span>
        </div>

        <div class="titlebar-center">
            <div class="logo-chip">
                <img src="logo.svg" alt="MRD Assistant logo" class="logo">
            </div>
        </div>

        <div class="status-pill" id="status-pill">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Connecting…</span>
        </div>
    </header>

    <!-- Chat scroll area -->
    <section class="chat-scroll" id="chat-container" aria-live="polite"></section>

    <!-- Welcome hero (hidden after first message) -->
    <section class="hero" id="hero">
        <p class="hero-kicker">Personal Knowledge Engine</p>
        <h2 class="hero-title">Ask me anything about<br><span class="accent-text">Manas' world.</span></h2>
        <p class="hero-sub">
            Projects · Experience · Skills · Open source · Certifications
        </p>

        <div class="suggestions" id="suggestions">
            <button class="chip">Featured Projects</button>
            <button class="chip">Work Experience</button>
            <button class="chip">Technical Skills</button>
            <button class="chip">Education and CGPA</button>
            <button class="chip">Certifications</button>
            <button class="chip">Open Source Activity</button>
        </div>
    </section>

    <!-- Composer -->
    <footer class="composer-wrap">
        <form class="composer" id="composer">
            <textarea id="message-input" rows="1" placeholder="Message MRD Assistant…"
                      autocomplete="off" spellcheck="false"></textarea>
            <button type="submit" id="send-btn" aria-label="Send message" disabled>↑</button>
        </form>
        <p class="footnote">
            Runs fully local — FAISS + Ollama. Responses may be inaccurate; verify what matters.
        </p>
    </footer>

</main>

<script src="script.js"></script>
</body>
</html>
